<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Submit a photo · Gallery</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; color: #0645ad; background: #fff; font-family: "Times New Roman", Times, serif; }
    main { width: min(100%, 520px); }
    h1 { margin: 0 0 1em; font-size: 24px; font-weight: normal; }
    label { display: block; margin: 0 0 7px; }
    input, button { font: inherit; }
    input[type="password"], input[type="file"] { display: block; width: 100%; margin-bottom: 20px; }
    button { padding: 7px 12px; color: #0645ad; background: white; border: 1px solid #0645ad; cursor: pointer; }
    #status { min-height: 1.5em; }
    a { color: #0645ad; }
  </style>
</head>
<body>
  <main>
    <h1>Upload to Personal Record Gallery</h1>
    <p>keep a flow. keep it balanced. keep your cool.</p>
    <form id="upload-form">
      <label for="password">Group upload password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <label for="photo">Choose a photo (JPEG, PNG, WebP, or GIF; 15 MB max)</label>
      <input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required>
      <button type="submit">Upload photo</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p><a href="/">Back to the gallery</a></p>
  </main>
  <script>
    const form = document.querySelector('#upload-form');
    const status = document.querySelector('#status');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = form.elements.photo.files[0];
      if (!file) return;
      if (file.size > 15 * 1024 * 1024) { status.textContent = 'The photo must be 15 MB or smaller.'; return; }
      const data = new FormData();
      data.append('photo', file);
      const button = form.querySelector('button');
      button.disabled = true;
      status.textContent = 'Uploading…';
      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'x-upload-password': form.elements.password.value },
          body: data
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Upload failed.');
        status.textContent = 'Photo uploaded. It will appear at the top of the gallery.';
        form.elements.photo.value = '';
      } catch (error) {
        status.textContent = error.message || 'Upload failed. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
