<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A gallery.">
  <title>Gallery</title>
  <style>
    :root { --paper: #fff; --ink: #0645ad; --gutter: 18px; }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "Times New Roman", Times, serif; }
    .gallery { width: 50vw; min-height: 100vh; padding: var(--gutter); }
    .photo { display: block; width: 100%; margin: 0 0 var(--gutter); padding: 0; border: 0; background: transparent; cursor: zoom-in; }
    .photo img { display: block; width: 100%; height: auto; }
    .note { position: fixed; top: 25vh; right: 5vw; width: min(30vw, 360px); color: var(--ink); font-size: 18px; line-height: 1.35; }
    .note p { margin: 0 0 .35em; }
    a { color: var(--ink); }
    a:visited { color: var(--ink); }
    .lightbox { position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; padding: 3vh 3vw; background: rgba(255,255,255,.96); cursor: zoom-out; }
    .lightbox[aria-hidden="false"] { display: flex; }
    .lightbox img { display: block; max-width: 94vw; max-height: 94vh; width: auto; height: auto; object-fit: contain; cursor: default; }
    .close { position: absolute; top: 12px; right: 18px; border: 0; padding: 4px 8px; background: transparent; color: var(--ink); font: inherit; font-size: 28px; cursor: pointer; }
    @media (max-width: 700px) {
      :root { --gutter: 10px; }
      .gallery { width: 68vw; padding: var(--gutter); }
      .note { top: 25vh; right: 4vw; width: 24vw; font-size: clamp(12px, 3.3vw, 16px); overflow-wrap: anywhere; }
    }
  </style>
</head>
<body>
  <main class="gallery" id="gallery" aria-label="Photo gallery">Loading photos…</main>
  <aside class="note" aria-label="About this gallery">
    <p>A Personal Record Year</p>
    <p>Group show, December 18 <br> at Personal Record Gallery</p>
    <p><br></p>
    <p>This is a photoblog with pictures uploaded by the artists participating in the group show.</p>
    <p><br></p>
    <p><a href="mailto:personalrecordgallery@gmail.com">mail</a></p>
    <p><a href="https://www.instagram.com/personalrecord.gallery/" target="_blank" rel="noopener noreferrer">instagram</a></p>
    <p><a href="/submit.html">upload</a></p>
  </aside>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Full size photo" aria-hidden="true">
    <button class="close" type="button" aria-label="Close photo">×</button>
    <img src="" alt="">
  </div>
  <script>
    const gallery = document.querySelector('#gallery');
    const lightbox = document.querySelector('#lightbox');
    const enlarged = lightbox.querySelector('img');
    const closeButton = lightbox.querySelector('.close');
    let previousFocus;

    function closePhoto() {
      lightbox.setAttribute('aria-hidden', 'true');
      enlarged.removeAttribute('src');
      document.body.style.overflow = '';
      previousFocus?.focus();
    }
    function openPhoto(button) {
      const image = button.querySelector('img');
      previousFocus = button;
      enlarged.src = image.currentSrc || image.src;
      enlarged.alt = image.alt;
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      closeButton.focus();
    }
    async function loadPhotos() {
      try {
        const response = await fetch('/api/photos', { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load photos.');
        const photos = await response.json();
        gallery.replaceChildren();
        photos.forEach((photo, index) => {
          const button = document.createElement('button');
          button.className = 'photo';
          button.type = 'button';
          button.setAttribute('aria-label', `Open photo ${index + 1} full size`);
          const image = document.createElement('img');
          image.src = photo.url;
          image.alt = '';
          image.loading = index === 0 ? 'eager' : 'lazy';
          button.append(image);
          button.addEventListener('click', () => openPhoto(button));
          gallery.append(button);
        });
        if (photos.length === 0) gallery.textContent = 'No photos yet.';
      } catch {
        gallery.textContent = 'Photos could not be loaded right now.';
      }
    }
    loadPhotos();
    closeButton.addEventListener('click', closePhoto);
    lightbox.addEventListener('click', (event) => { if (event.target === lightbox) closePhoto(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && lightbox.getAttribute('aria-hidden') === 'false') closePhoto(); });
  </script>
</body>
</html>
